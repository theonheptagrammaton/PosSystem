server {
    listen 80;
    
    # BU SATIR CSS'LERİN YÜKLENMESİ İÇİN ŞART
    include /etc/nginx/mime.types; 

    root /usr/share/nginx/html;
    index index.html;

    # React Router'ın çalışması için gerekli (Sayfa yenileyince 404 vermesin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API isteklerini Backend'e yönlendir
    location /api {
        proxy_pass https://posapi.theon.com.tr; # Senin backend adresin
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}